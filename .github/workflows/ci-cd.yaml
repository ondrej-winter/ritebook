name: CI/CD

"on":
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run ty check src/ritebook

      - name: Test
        run: uv run pytest

      - name: Build distribution packages
        run: uv build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/

  docker-e2e:
    name: Docker E2E
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build Docker E2E image
        run: docker build -f Dockerfile.e2e -t ritebook-e2e .

      - name: Run Docker E2E tests
        run: docker run --rm ritebook-e2e

  patch-release:
    name: Create patch release and publish to PyPI
    if: >-
      github.event_name == 'push' &&
      !startsWith(github.event.head_commit.message, 'release: bump version to ')
    needs: [quality, docker-e2e]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ritebook/
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Create release app token
        id: release-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RITEBOOK_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RITEBOOK_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.release-token.outputs.token }}

      - name: Verify release source is current master
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags origin master
          actual_sha="$(git rev-parse refs/remotes/origin/master)"
          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "::error::master advanced from $EXPECTED_SHA to $actual_sha before release"
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Configure release author
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          RELEASE_APP_SLUG: ${{ steps.release-token.outputs.app-slug }}
        run: |
          app_user_id="$(gh api "/users/${RELEASE_APP_SLUG}[bot]" --jq .id)"
          git config user.name "${RELEASE_APP_SLUG}[bot]"
          git config user.email "${app_user_id}+${RELEASE_APP_SLUG}[bot]@users.noreply.github.com"

      - name: Create patch release commit and tag
        id: release
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        run: |
          uv run semantic-release version \
            --patch \
            --no-changelog \
            --no-push \
            --no-vcs-release
          echo "tag=$(git describe --tags --exact-match HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push release commit and tag
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |-
          git push --atomic origin \
            "HEAD:refs/heads/master" \
            "refs/tags/${RELEASE_TAG}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        run: >-
          gh release create "${{ steps.release.outputs.tag }}" dist/*
          --verify-tag
          --title "${{ steps.release.outputs.tag }}"
          --notes ""

      - name: Publish distribution packages to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
