default_language_version:
  python: python3.13

exclude: ^\.agents/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: make lint
        language: system
        files: &python_checks '\.pyi?$|^(pyproject\.toml|uv\.lock|Makefile|\.pre-commit-config\.yaml)$'
        pass_filenames: false
      - id: ruff-format
        name: ruff format check
        entry: make format-check
        language: system
        files: *python_checks
        pass_filenames: false
      - id: ty
        name: ty
        entry: make type
        language: system
        files: *python_checks
        pass_filenames: false
      - id: import-linter
        name: import-linter
        entry: make architecture
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: make test
        language: system
        files: *python_checks
        pass_filenames: false
