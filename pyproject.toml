[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ritebook"
version = "0.1.46"
description = "A minimal placeholder package for the future Ritebook project."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
    { name = "Ondřej Winter" },
]
keywords = ["ritebook"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pyyaml>=6.0.3",
]

[project.scripts]
ritebook = "ritebook.cli:main"

[project.urls]
Homepage = "https://github.com/ondrej-winter/ritebook"
Repository = "https://github.com/ondrej-winter/ritebook"
Issues = "https://github.com/ondrej-winter/ritebook/issues"

[dependency-groups]
dev = [
    "fabrica>=0.0.33",
    "import-linter>=2.3",
    "pre-commit>=4.6.2",
    "pytest>=8.4.1",
    "pytest-xdist>=3.8.0",
    "python-semantic-release>=10.6.1",
    "ruff>=0.16.4",
    "ty>=0.0.75",
    "types-pyyaml>=6.0.12.20260815",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ritebook"]

[tool.semantic_release]
assets = ["uv.lock"]
build_command = "uv lock && uv build"
commit_message = "release: bump version to {version}"
commit_parser = "conventional"
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]

[tool.semantic_release.branches.master]
match = "master"
prerelease = false

[tool.semantic_release.changelog.default_templates]
output_format = ""

[tool.semantic_release.remote]
name = "origin"
type = "github"

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = [".agents"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "CPY001",
    "D100",
    "D104",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D101", "D102", "D103", "D107", "DTZ001", "PLR0913", "PLR0917", "PLR2004", "S101", "S108"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.importlinter]
root_package = "ritebook"

[[tool.importlinter.contracts]]
name = "Feature cores do not import adapters"
type = "forbidden"
source_modules = [
    "ritebook.features.*.application",
    "ritebook.features.*.domain",
]
forbidden_modules = [
    "ritebook.adapters",
    "ritebook.features.*.adapters",
]

[tool.ty.src]
include = ["src/ritebook"]

[tool.pytest.ini_options]
addopts = "-n auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "e2e: black-box end-to-end tests that exercise the real CLI and external process boundaries",
    "integration: adapter integration tests that exercise real local I/O boundaries",
]
